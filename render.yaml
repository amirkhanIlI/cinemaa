services:
  - type: web
    name: clean-cinema
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CINEMA_DB_PATH
        value: /opt/render/project/src/cinema_history.db
    plan: free
